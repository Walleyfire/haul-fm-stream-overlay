<!doctype html>
<html lang="fi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Haul.FM | Stream Overlay</title>
  <style>
    :root{--accent:#26bafa;--scale:1;color-scheme:dark;font-family:Inter,'Segoe UI',Arial,sans-serif}
    *{box-sizing:border-box}
    html,body{margin:0;background:transparent;color:#fff;width:100%;min-height:170px;overflow:hidden}
    .stage{width:580px;height:170px;transform:scale(var(--scale));transform-origin:top left}
    .card{position:relative;isolation:isolate;width:580px;height:166px;border-radius:17px;overflow:hidden;background:#11151b;border:1px solid #313640;box-shadow:none}
    .bg-art{position:absolute;inset:-32px;background-size:cover;background-position:center;filter:blur(26px) brightness(.25) saturate(1.15);opacity:0;transition:opacity .65s;z-index:-3}
    .card.has-art .bg-art{opacity:1}
    .bg-fallback{position:absolute;inset:0;z-index:-4;background:radial-gradient(ellipse at 7% 92%,color-mix(in srgb,var(--accent),transparent 83%),transparent 52%),linear-gradient(130deg,#182430,#11161c 62%,#0e1117)}
    .veil{position:absolute;inset:0;z-index:-2;background:linear-gradient(90deg,#0d111b4d,#0e111a77 78%)}
    .content{display:flex;gap:15px;padding:16px;height:100%;position:relative;z-index:2}
    .cover{width:132px;height:132px;flex:none;border-radius:10px;overflow:hidden;position:relative;box-shadow:0 0 0 1px #ffffff1d,0 9px 20px #0006;background:#18133b}
    /* Album art is always on top of the fallback, never underneath it. */
    .placeholder{position:absolute;inset:0;z-index:1;display:flex;align-items:center;justify-content:center;user-select:none}
    .placeholder img{display:block;width:106px;height:106px;object-fit:contain;filter:drop-shadow(0 4px 10px #0007)}
    #coverImg{position:absolute;inset:0;z-index:2;display:block;width:100%;height:100%;object-fit:cover;opacity:0;visibility:hidden;transition:opacity .24s ease}
    .cover.with-image #coverImg{opacity:1;visibility:visible}
    .cover.with-image .placeholder{visibility:hidden}
    
    .details{min-width:0;flex:1;position:relative;padding:1px 4px 0 0;display:flex;flex-direction:column}
    .upper{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:24px}
    .onair{display:inline-flex;align-items:center;gap:7px;color:#f0faff;font-size:10px;letter-spacing:1.6px;font-weight:750;white-space:nowrap}
    .light{height:8px;width:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px color-mix(in srgb,var(--accent),transparent 30%);animation:pulse 2.3s infinite}
    .card.is-offline .light{background:#f88d87;box-shadow:none;animation:none}
    .card.is-loading .light{background:#a2a7ad;animation:pulse 2.3s infinite}
    .brand{width:auto;height:40px;display:flex;align-items:center;justify-content:flex-end;flex:none;min-width:95px}
    .brand .brand-official{display:block;width:113px;max-width:113px;max-height:34px;height:auto;object-fit:contain;object-position:right center;filter:drop-shadow(0 2px 10px #0007)}
    .playing{padding-top:15px;flex:1;min-width:0}
    .eyebrow{font-size:9px;font-weight:750;letter-spacing:1.5px;color:color-mix(in srgb,var(--accent),white 35%);margin-bottom:5px;text-transform:uppercase}
    .song{font-size:21px;font-weight:770;line-height:1.18;margin:0;max-height:50px;min-height:25px;overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow-wrap:anywhere;text-shadow:0 2px 8px #0008}
    .artist{font-size:13px;font-weight:500;color:#d5dce5;margin:5px 0 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-shadow:0 2px 6px #0007}
    .bottom{height:22px;display:flex;align-items:center;justify-content:space-between;gap:9px;margin-top:auto;color:#b7c7d3;font-size:10px;font-variant-numeric:tabular-nums}
    .hint{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;max-width:100%;opacity:.9}
    .song-time{color:#f4faff;font-size:12px;font-weight:700;letter-spacing:.1px;white-space:nowrap;font-variant-numeric:tabular-nums;min-width:99px;text-align:right;text-shadow:0 1px 5px #000b}
    .song-time:not(.visible){visibility:hidden}
    .song-progress{position:absolute;left:0;right:0;bottom:0;height:5px;z-index:4;background:#ffffff32;opacity:0;transition:opacity .2s ease;pointer-events:none;overflow:hidden}
    .song-progress.visible{opacity:1}
    .song-progress-fill{height:100%;width:0;background:var(--accent);box-shadow:0 0 10px color-mix(in srgb,var(--accent),transparent 30%);transition:width .75s linear}
    @keyframes pulse{50%{opacity:.45;box-shadow:0 0 5px var(--accent)}}
    @media (prefers-reduced-motion:reduce){.light{animation:none}}
  </style>
</head>
<body>
  <main class="stage">
    <section class="card is-loading" id="card" aria-label="Haul.FM radiotiedot">
      <div class="bg-fallback"></div><div class="bg-art" id="bgArt"></div><div class="veil"></div>
      <div class="content">
        <div class="cover" id="cover">
          <div class="placeholder" aria-hidden="true"><img id="fallbackCover" src="https://haul.fm/brand/icon-96.webp" alt="" /></div>
          <img id="coverImg" alt="Kappaleen kansikuva" />
        </div>
        <div class="details">
          <div class="upper"><span class="onair"><span class="light"></span><span id="liveText">YHDISTETÄÄN</span></span><div class="brand" title="Haul.FM"><img id="brandLogo" class="brand-official" src="https://haul.fm/brand/wordmark-275.webp" alt="Haul.FM virallinen logo" /></div></div>
          <div class="playing"><div class="eyebrow" id="eyebrow">RADIO STREAM</div><h1 class="song" id="song">Haul.FM</h1><p class="artist" id="artist">Haetaan kappaletietoja…</p></div>
          <div class="bottom"><span class="hint" id="hint">Haul.FM • Live radio</span><span class="song-time" id="songTime" aria-label="Kappaleen suuntaa-antava aika">--:-- / --:--</span></div>
        </div>
      </div>
      <div class="song-progress" id="songProgress" role="progressbar" aria-label="Arvioitu kappaleen eteneminen" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="song-progress-fill" id="progressFill"></div></div>
    </section>
  </main>
  <script>
    (() => {
      'use strict';
      const $ = id => document.getElementById(id);
      const params = new URLSearchParams(location.search);
      const scale = Number(params.get('scale') || '1');
      if (Number.isFinite(scale) && scale >= 0.35 && scale <= 3) document.documentElement.style.setProperty('--scale', String(scale));
      const color = params.get('accent');
      if (color && /^#[0-9a-fA-F]{6}$/.test(color)) document.documentElement.style.setProperty('--accent', color);
      const state = {status:'loading',last_checked:0};
      const apiUrl = 'nowplaying.json'; // GitHub Actions updates this on every Pages deployment.
      const demonstration = params.get('demo') === '1';
      let localFirstSeen = 0, lastTrack = '';
      let demoStarted = Date.now() / 1000 - 85;
      let coverUrl = '';
      const failedArtwork = new Set();
      const card=$('card'), cover=$('cover'), coverImg=$('coverImg'), bgArt=$('bgArt');
      const brandLogo=$('brandLogo');
      const fallbackCover=$('fallbackCover');
      const officialLogo='https://haul.fm/brand/wordmark-275.webp';
      let requestedLogo='';
      // The exact official Haul.FM assets are used first. Local image fallbacks
      // ensure OBS renders something even if the website blocks/unloads them.
      fallbackCover.addEventListener('error',()=>{
        if(!fallbackCover.src.endsWith('/assets/autodj.png')) fallbackCover.src='assets/autodj.png';
      });
      brandLogo.addEventListener('error',()=>{
        if(!brandLogo.src.endsWith('/assets/wordmark.png')) brandLogo.src='assets/wordmark.png';
      });
      function updateBrandLogo(){
        const desired = officialLogo;
        if (requestedLogo === desired) return;
        requestedLogo=desired;
        brandLogo.src=desired;
      }
      function showArtwork(url){
        const safe = typeof url === 'string' && /^https:\/\//i.test(url) && !failedArtwork.has(url) ? url : '';
        if (safe === coverUrl) return;
        coverUrl = safe;
        cover.classList.remove('with-image');
        card.classList.remove('has-art');
        bgArt.style.backgroundImage = 'none';
        coverImg.onload = null;
        coverImg.onerror = null;
        coverImg.removeAttribute('src');
        if (!safe) return; // Only now can the fallback be visible.
        const requestUrl = safe;
        coverImg.onload = () => {
          if(coverUrl !== requestUrl) return;
          // Album art is displayed above the Haul.FM fallback image.
          cover.classList.add('with-image');
          card.classList.add('has-art');
          bgArt.style.backgroundImage = `url("${requestUrl.replaceAll('"','%22')}")`;
        };
        coverImg.onerror = () => {
          if(coverUrl !== requestUrl) return;
          failedArtwork.add(requestUrl);
          coverUrl = '';
          cover.classList.remove('with-image');
          card.classList.remove('has-art');
          coverImg.removeAttribute('src');
          bgArt.style.backgroundImage = 'none';
        };
        coverImg.src = safe;
        // An image may already be in the browser cache.
        if(coverImg.complete && coverImg.naturalWidth > 0) coverImg.onload();
      }
      const progressTrack = $('songProgress');
      const progressFill = $('progressFill');
      const songTime = $('songTime');
      function clock(seconds){
        const sec = Math.max(0, Math.floor(seconds));
        return String(Math.floor(sec/60)).padStart(2,'0') + ':' + String(sec%60).padStart(2,'0');
      }
      function updateProgress(){
        const live=state.status === 'live' && Boolean(state.title);
        const started=Number(state.first_seen);
        const hasStart=Number.isFinite(started) && started > 0;
        const seconds=hasStart ? Math.max(0,Date.now()/1000-started) : 0;
        const duration=Number(state.duration);
        // Number(null) == 0: only use a real, positive duration value.
        const hasDuration=state.duration != null && Number.isFinite(duration) && duration >= 30;
        // A cached track may remain after it has ended. Do not freeze a false 100%.
        const canEstimate=live && hasStart && hasDuration && seconds <= duration + 20;
        // Hide song progress entirely unless we have a reliable duration.
        progressTrack.classList.toggle('visible',canEstimate);
        songTime.classList.toggle('visible',live);
        if(!live){
          songTime.textContent='--:-- / --:--';
          progressFill.style.width='0%';
          progressTrack.removeAttribute('aria-valuenow');
          progressTrack.removeAttribute('aria-valuetext');
          return;
        }
        const elapsed=clock(seconds);
        songTime.textContent=elapsed+' / '+(canEstimate ? clock(duration) : '--:--');
        songTime.title=canEstimate
          ? 'Suuntaa-antava aika: laskettu kappaleen havaitsemisesta, ei lähetyksen tarkasta alusta'
          : 'Kappaleen havaitsemisesta kulunut aika; kestoa ei saatu selville';
        if(canEstimate){
          const percent=Math.max(0,Math.min(100,seconds/duration*100));
          progressFill.style.width=percent.toFixed(2)+'%';
          progressTrack.setAttribute('aria-valuenow',String(Math.round(percent)));
          progressTrack.setAttribute('aria-valuetext','Arvioitu eteneminen '+Math.round(percent)+' prosenttia');
        }else{
          // Unknown duration: no animated, indeterminate or guessed progress.
          progressFill.style.width='0%';
          progressTrack.removeAttribute('aria-valuenow');
          progressTrack.removeAttribute('aria-valuetext');
        }
      }
      function render(){
        updateBrandLogo();
        const s=state.status||'loading';
        card.classList.toggle('is-loading',s==='loading');
        card.classList.toggle('is-offline',s==='offline');
        const live=s==='live';
        $('liveText').textContent=s==='offline'?'OFFLINE':s==='loading'?'YHDISTETÄÄN':'ON AIR';
        $('eyebrow').textContent=live?'NOW PLAYING':'RADIO STREAM';
        $('song').textContent=live?state.title:(s==='offline'?'Yhteys katkennut':'Haul.FM');
        $('artist').textContent=live?(state.artist||'Haul.FM Radio'):
          s==='offline'?'Radioaseman tiedot eivät ole saatavilla':
          s==='no_metadata'?'Lähetys käynnissä • kappaletietoja ei saatavilla':
          'Haetaan kappaletietoja…';
        $('hint').textContent=live?'Haul.FM • Kappale havaittu radiosta':
          s==='offline'?'Tarkista radioaseman yhteys':
          'Haul.FM • Live radio';
        if(window.HAULFM_AUDIO_STATUS) $('hint').textContent=window.HAULFM_AUDIO_STATUS;
        showArtwork(live?state.artwork:null);
        updateProgress();
      }
      let pending=false;
      async function poll(){
        if(pending) return;
        if(demonstration){
          Object.assign(state,{
            status:'live',artist:'The Midnight',title:'Sunset',
            duration:240,first_seen:demoStarted,artwork:null,
            last_checked:Date.now()/1000
          });
          render();
          return;
        }
        pending=true;
        try{
          const res=await fetch(apiUrl + '?t=' + Date.now(),{cache:'no-store'});
          if(!res.ok) throw new Error('API HTTP '+res.status);
          const data=await res.json();
          if(!data || typeof data !== 'object') throw new Error('Virheellinen kappaletieto');
          if((Date.now()/1000-Number(data.last_checked||0))>960) data.status='offline';
          // Keep a stable estimate within this browser session even when an edge worker restarts.
          const key=(data.artist||'')+'\u001f'+(data.title||'');
          if(data.status==='live' && data.title){
            if(key !== lastTrack){
              lastTrack=key;
              localFirstSeen=Number(data.first_seen)>0 ? Number(data.first_seen) : Date.now()/1000;
            }
            data.first_seen=localFirstSeen;
          }else{
            lastTrack=''; localFirstSeen=0;
          }
          Object.assign(state,data);
          render();
        }catch(e){
          // Keep last known song temporarily rather than showing imaginary metadata.
          if(!state.last_checked || Date.now()/1000-Number(state.last_checked)>45){
            state.status='offline';render();
          }
          console.warn('HaulFM API ei vastaa',e);
        }finally{pending=false;}
      }
      updateBrandLogo();poll();setInterval(poll,30000);setInterval(updateProgress,1000);
    })();
  </script>

  <!-- Radioääni; ei näkyviä säätimiä tai soittopainikkeita. -->
  <audio id="haulfmRadioAudio" autoplay playsinline preload="none" aria-hidden="true"></audio>
  <script>
    (() => {
      'use strict';
      // Browsers require a secure source AND may require a real user gesture.
      // No GitHub Pages code can bypass these browser-enforced restrictions.
      const params = new URLSearchParams(location.search);
      if (params.get('demo') === '1') return;

      const audio = document.getElementById('haulfmRadioAudio');
      const hint = document.getElementById('hint');
      const sources = [];
      const selected = params.get('stream');
      if (selected) {
        try {
          const u = new URL(selected);
          if (u.protocol === 'https:' || (u.protocol === 'http:' && ['localhost','127.0.0.1'].includes(u.hostname))) {
            sources.push(u.href);
          }
        } catch (error) { console.warn('Haul.FM: virheellinen stream-parametri', error); }
      }
      // These HTTPS alternatives are unverified. The HTTP URL is the original
      // user-supplied stream; secure browsers may block upgrading it to TLS.
      sources.push(
        'https://stream.haul.fm/haulmpfm.mp3',
        'https://stream.haul.fm:8000/haulmpfm.mp3',
        'http://stream.haul.fm:8000/haulmpfm.mp3'
      );

      const urls = [...new Set(sources)];
      let index = 0;
      let attemptId = 0;
      let blocked = false;
      let watchdog = null;
      let retry = null;
      let failedAttempt = -1;
      audio.volume = 1;
      audio.muted = false;

      function status(message) {
        window.HAULFM_AUDIO_STATUS = message;
        if (hint) {
          hint.textContent = message || 'Haul.FM • Live radio';
          hint.title = message || '';
        }
      }
      function clearTimers() {
        clearTimeout(watchdog);
        clearTimeout(retry);
        watchdog = null;
        retry = null;
      }
      function fail(id, reason) {
        if (id !== attemptId || failedAttempt === id || blocked) return;
        failedAttempt = id;
        clearTimers();
        console.warn('Haul.FM: äänilähde ei toiminut:', reason, urls[index - 1]);
        retry = setTimeout(nextSource, 600);
      }
      function nextSource() {
        clearTimers();
        blocked = false;
        if (index >= urls.length) {
          status('Ääni ei toimi • HTTPS-äänivirta tarvitaan');
          console.warn('Haul.FM: kaikki stream-vaihtoehdot epäonnistuivat. Tarkista verkkokonsoli.');
          index = 0;
          retry = setTimeout(nextSource, 60000);
          return;
        }
        const id = ++attemptId;
        const url = urls[index++];
        status('');
        console.info('Haul.FM: kokeillaan radiota', url);
        audio.pause();
        audio.src = url;
        audio.load();

        watchdog = setTimeout(() => fail(id, '15 sekunnin aikakatkaisu'), 15000);
        const attempt = audio.play();
        if (attempt && typeof attempt.catch === 'function') {
          attempt.catch(error => {
            if (id !== attemptId) return;
            if (error && error.name === 'NotAllowedError') {
              blocked = true;
              clearTimers();
              status('Selain esti äänen • klikkaa overlayta kerran');
              console.warn('Haul.FM: äänen automaattinen toisto estetty selaimen asetuksilla');
              return;
            }
            if (error && error.name === 'AbortError') return;
            fail(id, error ? error.name : 'play() epäonnistui');
          });
        }
      }

      audio.addEventListener('playing', () => {
        blocked = false;
        clearTimers();
        status('');
        console.info('Haul.FM: radioääni toistuu');
      });
      audio.addEventListener('error', () => fail(attemptId, audio.error ? 'MediaError ' + audio.error.code : 'medialähteen virhe'));
      audio.addEventListener('ended', () => fail(attemptId, 'lähetys katkesi'));
      document.addEventListener('click', () => {
        if (!blocked) return;
        // Only a real user gesture can unblock autoplay. No visible button.
        blocked = false;
        status('');
        const id = attemptId;
        watchdog = setTimeout(() => fail(id, '15 sekunnin aikakatkaisu'), 15000);
        const attempt = audio.play();
        if (attempt && typeof attempt.catch === 'function') {
          attempt.catch(error => {
            if (id !== attemptId) return;
            if (error && error.name === 'NotAllowedError') {
              blocked = true;
              clearTimers();
              status('Selain esti äänen • klikkaa overlayta kerran');
            } else if (!error || error.name !== 'AbortError') {
              fail(id, error ? error.name : 'äänivirran lataus epäonnistui');
            }
          });
        }
      });
      nextSource();
    })();
  </script>
</body>
</html>
