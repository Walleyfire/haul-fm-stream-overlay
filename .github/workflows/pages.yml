name: Publish Haul.FM overlay (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'scripts/**'
      - '.github/workflows/pages.yml'
      - 'README.md'
  schedule:
    # Run at minutes 2,7,12,...57 UTC, avoiding the busy top of the hour.
    # GitHub may still delay or drop scheduled runs.
    - cron: '2-59/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Validate metadata parser
        run: python3 scripts/update_nowplaying.py --self-test
      - name: Fetch Haul.FM metadata
        run: python3 scripts/update_nowplaying.py
      - name: Verify metadata publication
        shell: bash
        run: |
          python3 - <<'PY'
          import json, pathlib
          data=json.loads(pathlib.Path('docs/nowplaying.json').read_text(encoding='utf-8'))
          assert data['status'] in ('live','no_metadata','offline')
          assert int(data['last_checked']) > 0
          print('Workflow trigger:', __import__('os').environ.get('GITHUB_EVENT_NAME'))
          print('Metadata status:', data['status'])
          print('Source:', data.get('source'))
          print('Title:', data.get('title'))
          print('Issue:', data.get('error'))
          with open(__import__('os').environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as f:
              f.write(f"### Haul.FM status: {data['status']}\n\n")
              f.write(f"- Trigger: {__import__('os').environ.get('GITHUB_EVENT_NAME')}\n")
              f.write(f"- Metadata source: {data.get('source')}\n")
              f.write(f"- Track: {data.get('artist')} — {data.get('title')}\n")
              if data.get('error'):
                  f.write(f"- Fetch issue: {data['error']}\n")
          PY
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages files
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
